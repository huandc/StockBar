name: Build & Release

on:
  push:
    # release/* 分支:创建或推送即触发发布
    # 语义:发布新版 = 从 main 切 release/vX.Y.Z;补丁 = 从对应版本分支切 release/vX.Y.1
    branches: [ 'release/*' ]
  workflow_dispatch:
    inputs:
      version:
        description: '自定义版本号(留空则自动 1.0.<序号>)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: 构建并发布 StockBar
    runs-on: macos-latest
    steps:
      - name: 检出代码(完整历史,供变更日志生成)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 编译 Release 版本
        run: swift build -c release

      - name: 打包 .app 并压缩
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" == release/* ]]; then
            # 版本号取自 release 分支名:release/v1.2.0 → 1.2.0
            VERSION="${GITHUB_REF_NAME#release/}"
            VERSION="${VERSION#v}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

          mkdir -p StockBar.app/Contents/MacOS StockBar.app/Contents/Resources
          cp .build/release/StockBar StockBar.app/Contents/MacOS/StockBar

          cat > StockBar.app/Contents/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CFBundleDevelopmentRegion</key>
          	<string>zh_CN</string>
          	<key>CFBundleExecutable</key>
          	<string>StockBar</string>
          	<key>CFBundleIdentifier</key>
          	<string>com.huandc.StockBar</string>
          	<key>CFBundleInfoDictionaryVersion</key>
          	<string>6.0</string>
          	<key>CFBundleName</key>
          	<string>StockBar</string>
          	<key>CFBundleDisplayName</key>
          	<string>StockBar</string>
          	<key>CFBundlePackageType</key>
          	<string>APPL</string>
          	<key>CFBundleShortVersionString</key>
          	<string>${VERSION}</string>
          	<key>CFBundleVersion</key>
          	<string>${VERSION}</string>
          	<key>LSMinimumSystemVersion</key>
          	<string>13.0</string>
          	<key>LSApplicationCategoryType</key>
          	<string>public.app-category.finance</string>
          	<key>LSUIElement</key>
          	<true/>
          	<key>NSHighResolutionCapable</key>
          	<true/>
          	<key>NSHumanReadableCopyright</key>
          	<string>Copyright © 2026 huandc</string>
          </dict>
          </plist>
          PLIST

          # Apple Silicon 必须签名才能运行;这里做 ad-hoc 签名
          codesign --force --deep --sign - StockBar.app
          codesign --verify --verbose StockBar.app

          ditto -c -k --keepParent StockBar.app "StockBar-${VERSION}-macOS.zip"
          echo "打包完成: StockBar-${VERSION}-macOS.zip"

      - name: 生成变更日志(Conventional Commits)
        run: |
          set -euo pipefail
          brew install git-cliff >/dev/null 2>&1
          git-cliff --unreleased > .notes.tmp 2>/dev/null || echo "" > .notes.tmp
          {
            echo "## StockBar ${VERSION}"
            echo ""
            cat .notes.tmp
          } > notes.md
          cat notes.md

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: StockBar-${{ env.VERSION }}-macOS
          path: StockBar-*.zip
          if-no-files-found: error

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ env.VERSION }}"
          TAG="v${VERSION}"
          ZIP="StockBar-${VERSION}-macOS.zip"
          if gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ZIP}" --clobber --repo "${{ github.repository }}"
            echo "已更新已有 Release ${TAG}"
          else
            gh release create "${TAG}" "${ZIP}" \
              --repo "${{ github.repository }}" \
              --title "StockBar ${VERSION}" \
              --notes-file notes.md
            echo "已创建 Release ${TAG}"
          fi

      - name: 回合到 main(防漂移)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor HEAD refs/remotes/origin/main 2>/dev/null; then
            echo "::notice::release 分支内容已全部在 main 中,无需回合"
          else
            echo "release 分支包含 main 中没有的提交(通常是热修复),自动创建回合 PR..."
            gh pr create --base main --head "${GITHUB_REF_NAME}" \
              --repo "${{ github.repository }}" \
              --title "fix: 回合 ${GITHUB_REF_NAME} 的修复到 main" \
              --body "自动创建:${GITHUB_REF_NAME} 包含 main 中不存在的提交(通常是热修复)。请合入 main,防止修复在下次发布时丢失。" \
              || echo "::notice::回合 PR 可能已存在,跳过"
          fi
