name: Build & Release

on:
  push:
    # 只有代码/构建配置变更才自动打包;README、文档等日常改动不触发
    - branches: [ main ]
      paths:
        - 'Sources/**'
        - 'Package.swift'
        - '.github/workflows/**'
    # 打 tag v* 永远发布(与变更文件无关)
    - tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 StockBar
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 编译 Release 版本
        run: swift build -c release

      - name: 打包 .app 并压缩
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

          mkdir -p StockBar.app/Contents/MacOS StockBar.app/Contents/Resources
          cp .build/release/StockBar StockBar.app/Contents/MacOS/StockBar

          cat > StockBar.app/Contents/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CFBundleDevelopmentRegion</key>
          	<string>zh_CN</string>
          	<key>CFBundleExecutable</key>
          	<string>StockBar</string>
          	<key>CFBundleIdentifier</key>
          	<string>com.huandc.StockBar</string>
          	<key>CFBundleInfoDictionaryVersion</key>
          	<string>6.0</string>
          	<key>CFBundleName</key>
          	<string>StockBar</string>
          	<key>CFBundleDisplayName</key>
          	<string>StockBar</string>
          	<key>CFBundlePackageType</key>
          	<string>APPL</string>
          	<key>CFBundleShortVersionString</key>
          	<string>${VERSION}</string>
          	<key>CFBundleVersion</key>
          	<string>${VERSION}</string>
          	<key>LSMinimumSystemVersion</key>
          	<string>13.0</string>
          	<key>LSApplicationCategoryType</key>
          	<string>public.app-category.finance</string>
          	<key>LSUIElement</key>
          	<true/>
          	<key>NSHighResolutionCapable</key>
          	<true/>
          	<key>NSHumanReadableCopyright</key>
          	<string>Copyright © 2026 huandc</string>
          </dict>
          </plist>
          PLIST

          # Apple Silicon 必须签名才能运行;这里做 ad-hoc 签名
          codesign --force --deep --sign - StockBar.app
          codesign --verify --verbose StockBar.app

          ditto -c -k --keepParent StockBar.app "StockBar-${VERSION}-macOS.zip"
          echo "打包完成: StockBar-${VERSION}-macOS.zip"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: StockBar-${{ env.VERSION }}-macOS
          path: StockBar-*.zip
          if-no-files-found: error

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ env.VERSION }}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION}"
          fi
          ZIP="StockBar-${VERSION}-macOS.zip"
          if gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ZIP}" --clobber --repo "${{ github.repository }}"
            echo "已更新已有 Release ${TAG}"
          else
            gh release create "${TAG}" "${ZIP}" \
              --repo "${{ github.repository }}" \
              --title "StockBar ${VERSION}" \
              --notes "自动打包于 commit \`${{ github.sha }}\`。下载后解压,将 StockBar.app 拖入「应用程序」文件夹,首次运行请右键 →「打开」。"
            echo "已创建 Release ${TAG}"
          fi
