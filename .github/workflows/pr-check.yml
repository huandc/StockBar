name: PR Check

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 编译检查
        run: swift build

      - name: 单元测试
        run: ./scripts/test.sh

      - name: 校验 Issue 模板与工作流 YAML
        run: |
          ruby -ryaml -e 'ARGV.each { |f| YAML.load_file(f); puts "ok: #{f}" }' \
            .github/ISSUE_TEMPLATE/*.yml .github/workflows/*.yml

      - name: Issue 模板结构完整(name/description/body)
        run: |
          ruby -ryaml -e '
            ARGV.each do |f|
              next if f.end_with?("config.yml")
              d = YAML.load_file(f)
              %w[name description body].each do |k|
                abort("#{f} 缺少 #{k}") unless d[k]
              end
              abort("#{f} 的 body 不是数组") unless d["body"].is_a?(Array)
              d["body"].each do |item|
                abort("#{f} 有 format 不在允许列表: #{item["type"]}") unless
                  %w[markdown input textarea dropdown checkboxes].include?(item["type"])
              end
              puts "ok: #{f}"
            end' .github/ISSUE_TEMPLATE/*.yml

      - name: PR 标题符合 Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! [[ "${PR_TITLE}" =~ ^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_.-]+\))?!?:\ .+ ]]; then
            echo "::error::PR 标题不符合 Conventional Commits 规范"
            echo "示例: feat: 新增 XX / fix: 修复 XX / docs: 更新文档 / ci: 调整流水线"
            exit 1
          fi
