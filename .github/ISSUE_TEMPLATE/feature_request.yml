name: Feature request / 功能建议
description: 想要的新功能或改进(数据源、菜单栏样式、交互等)
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        这个项目刻意保持「纯菜单栏、轻量、零配置即可用」。
        建议里如果能说明「谁在什么场景下用、现在的做法有多麻烦」,更容易判断优先级。

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / Problem
      description: 描述场景与痛点,而不是直接给方案
      placeholder: 同时盯 5 只股票时,现在只能每次手动改代码,切一次要等一次请求…
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的做法 / Proposed solution
      placeholder: 菜单栏按固定间隔自动轮播自选列表,切换时不重新请求
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives
      description: 有没有用过别的 App 或变通做法,效果如何
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围 / Scope
      options:
        - 菜单栏展示与样式
        - 数据源与行情
        - 设置与交互
        - 构建、发布、工程化
        - 文档
        - 其他 / Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认 / Before submitting
      options:
        - label: 我已经搜索过现有 Issue,确认没有重复
          required: true
        - label: 这个建议符合「纯菜单栏、轻量」的定位
          required: true
